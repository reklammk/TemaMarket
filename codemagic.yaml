# Codemagic CI/CD Configuration for TEMA Market Mobile App
workflows:
  # -------------------------------------------------------------
  # 🍎 1. iOS WORKFLOW (App Store & TestFlight -> .ipa)
  # -------------------------------------------------------------
  ios-appstore:
    name: TEMA Market iOS App Store Build (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tema.temaMarket
      vars:
        BUNDLE_ID: "com.tema.temaMarket"
    scripts:
      - name: Flutter bağımlılıklarını yükle
        script: |
          flutter packages pub get
      - name: iOS Imzalama Profillerini Hazırla
        script: |
          xcode-project use-profiles
      - name: iOS IPA Arşivini Oluştur (Unsigned Build)
        script: |
          flutter build ipa --release --no-codesign --build-name=1.0.0 --build-number=${BUILD_NUMBER:-1}
      - name: iOS Paketini İmzala ve IPA Üret (Code Sign IPA)
        script: |
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
    publishing:
      email:
        recipients:
          - mehmetp835@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  # -------------------------------------------------------------
  # 🤖 2. ANDROID WORKFLOW (Google Play Store -> .aab)
  # -------------------------------------------------------------
  android-googleplay:
    name: TEMA Market Android Google Play Build (.aab)
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Flutter bağımlılıklarını yükle
        script: |
          flutter packages pub get
      - name: Android App Bundle (.aab) Oluştur
        script: |
          flutter build aab --release --build-name=1.0.0 --build-number=${BUILD_NUMBER:-1}
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - mehmetp835@gmail.com
