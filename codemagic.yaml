# Codemagic CI/CD Configuration for TEMA Market Mobile App
workflows:
  # -------------------------------------------------------------
  # 🍎 1. iOS WORKFLOW (App Store & TestFlight -> .ipa)
  # -------------------------------------------------------------
  ios-appstore:
    name: TEMA Market iOS App Store Build (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Maia Suites Resepsiyon"
    environment:
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - tema_appstore_2026
        certificates:
          - tema
      vars:
        BUNDLE_ID: "com.tema.san"
    scripts:
      - name: Flutter bağımlılıklarını yükle
        script: |
          flutter packages pub get
      - name: iOS Imzalama Profillerini Hazırla
        script: |
          xcode-project use-profiles
      - name: İmzalı Release IPA Oluştur
        script: |
          IOS_BUILD_NUMBER=$((30 + ${BUILD_NUMBER:-1}))
          echo "iOS build number: $IOS_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Release IPA Modunu Doğrula
        script: |
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "HATA: Doğrulanacak IPA bulunamadı."
            exit 1
          fi

          CHECK_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"
          APP_PATH="$(find "$CHECK_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          FLUTTER_BINARY="$APP_PATH/Frameworks/Flutter.framework/Flutter"

          if [ -z "$APP_PATH" ] || [ ! -f "$FLUTTER_BINARY" ]; then
            echo "HATA: IPA içindeki Flutter uygulaması doğrulanamadı."
            exit 1
          fi

          if find "$APP_PATH" -name kernel_blob.bin -print -quit | grep -q .; then
            echo "HATA: IPA debug Dart kernel'i içeriyor. TestFlight yüklemesi durduruldu."
            exit 1
          fi

          if strings "$FLUTTER_BINARY" | grep -Fq 'debug mode Flutter apps can only be launched'; then
            echo "HATA: IPA debug Flutter motoru içeriyor. TestFlight yüklemesi durduruldu."
            exit 1
          fi

          echo "Release IPA doğrulaması başarılı."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
    publishing:
      email:
        recipients:
          - mehmetp835@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # -------------------------------------------------------------
  # 🤖 2. ANDROID WORKFLOW (Google Play Store -> .aab)
  # -------------------------------------------------------------
  android-googleplay:
    name: TEMA Market Android Google Play Build (.aab)
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: 3.38.9
    scripts:
      - name: Flutter bağımlılıklarını yükle
        script: |
          flutter packages pub get
      - name: Android App Bundle (.aab) Oluştur
        script: |
          flutter build aab --release --build-name=1.0.0 --build-number=${BUILD_NUMBER:-1}
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - mehmetp835@gmail.com
