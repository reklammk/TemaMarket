name: tema_market
description: "TEMA Market Mobil Uygulaması"
publish_to: 'none'
version: 1.0.0+33

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color: "#ffffff"
  theme_color: "#DC2626"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
